        content="https://didieravz.github.io/wdd231/cumorahjewelry/images/brutoTallacuadrada.webp">

    <title>Cumorah Jewelry - Pendants</title>
    <link rel="icon" href="images/favicon.ico" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" />
    <link rel="stylesheet" href="styles/header-footer.css" />
    <link rel="stylesheet" href="styles/purchaseform.css" />
    <script src="scripts/header-footer.js" defer></script>
    <script src="scripts/purchaseform.js" defer></script>
</head>

<body>

    <header>
        <div class="header-content">
            <img src="images/favicon.ico" alt="Cumorah Jewelry logo" width="34" height="40" />
            <h2>Cumorah Jewelry</h2>
            <button id="hamburgerBtn" aria-label="Boton hamburguesa"></button>
        </div>
        <nav class="menuLinks">
            <ul id="primaryNav">
                <li><a href="index.html">Home</a></li>
                <li><a href="rings.html">Rings</a></li>
                <li><a href="pendants.html">Pendants</a></li>
                <li><a href="earrings.html">Earrings</a></li>
                <li><a href="emerald.html">Emeralds</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <div class="purchase-form-container">
            <h4>Formulario de Compra</h4>

            <form id="purchaseForm">
                <label for="customerName">Nombre:</label>
                <input type="text" id="customerName" required>

                <label for="customerEmail">Email:</label>
                <input type="email" id="customerEmail" required>

                <label for="quantity">Cantidad:</label>
                <input type="number" id="quantity" min="1" value="1" required>

                <button type="submit">Confirmar Compra</button>
            </form>
        </div>

    </main>

    <footer>
        <div class="footer-content">
            <div class="contact-info">
                <h3>Contact Us</h3>
                <p>calle 22 #2-29, Muzo, Boyacá, Colombia</p>
                <p>Email: info@CumorahJewelry.com</p>
                <p>Phone: +57 310 8445521</p>
            </div>
            <div class="dev-info">
                <p>
                    &copy; <span id="currentYear"></span> Cumorah Jewelry |
                    Didier Alexander Virguez Zapata | WDD 231 Final Project
                </p>
                <p>Last Modified: <span id="lastModified"></span></p>
            </div>
        </div>
    </footer>

</body>
